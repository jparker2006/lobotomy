<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>lobotomy</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px 24px; background: #0b0b0d; color: #ddd; font: 14px/1.4 system-ui, sans-serif; }
  form { display: flex; gap: 8px; }
  #prompt { flex: 1; padding: 8px 10px; background: #18181c; color: #eee; border: 1px solid #333; border-radius: 4px; font: inherit; }
  button { padding: 8px 16px; background: #2a2a31; color: #eee; border: 1px solid #444; border-radius: 4px; font: inherit; cursor: pointer; }
  #status { margin: 8px 0 12px; color: #888; font: 12px ui-monospace, monospace; white-space: pre; }
  main { display: flex; gap: 20px; align-items: flex-start; }
  #grid { flex: 1; display: grid; grid-template-columns: repeat(7, minmax(64px, 1fr)); gap: 6px 8px; max-width: 1100px; }
  .tile span { display: block; color: #777; font: 11px ui-monospace, monospace; }
  .tile canvas { display: block; width: 100%; image-rendering: pixelated; background: #000; }
  #answer { width: 340px; flex: none; height: calc(100vh - 120px); overflow-y: auto; white-space: pre-wrap; padding: 10px 12px; background: #131316; border: 1px solid #222; border-radius: 4px; }
</style>
</head>
<body>
<form id="ask" onsubmit="event.preventDefault()">
  <input id="prompt" autocomplete="off" placeholder="Ask Qwen something" value="Why is the sky blue? Answer in two sentences.">
  <button disabled>Ask</button>
</form>
<div id="status">connecting…</div>
<main>
  <div id="grid"></div>
  <div id="answer"></div>
</main>
<script type="module" src="main.js"></script>
</body>
</html>

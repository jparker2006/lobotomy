<!doctype html>
<html><head><meta charset="utf-8"><title>Q2 shape</title>
<link rel="stylesheet" href="../data/fonts/fonts.css">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c"></canvas>
<script type="module">
// Q2: the brain's shape, drawn in the chosen style (Q1: ASCII render + B's glow + A's bright amber + C's calm).
import { loadSession, glow, userPrompt, answerText, L, N } from "../lib/data.js";
import { camera } from "../lib/proj.js";
import { SHAPES } from "../lib/shapes.js";
import { STYLE, makeGrid, splat, polyline, put, putBig, draw } from "../lib/ascii.js";
const q = new URLSearchParams(location.search);
const S = q.get("s") || "ocean", T = +(q.get("t") || 52), shape = q.get("shape") || "deck";
const W = 1440, H = 900, dpr = devicePixelRatio;
const c = document.getElementById("c"); c.width = W * dpr; c.height = H * dpr; c.style.width = W + "px"; c.style.height = H + "px";
const g = c.getContext("2d"); g.scale(dpr, dpr);
for (const f of ["400 14px 'JetBrains Mono'", "700 14px 'JetBrains Mono'", "300 28px 'JetBrains Mono'"]) await document.fonts.load(f);
const { tokens } = await loadSession(S);
const t = Math.min(T, tokens.length - 1), v = glow(tokens, t);

const PRESETS = {
  deck:   { eye: [-22.4, 8.6, 31.2], tgt: [0, -0.5, 0], fov: 22, cxy: [0.53, 0.42], title: "DECK" },
  ring:   { eye: [0, 8.2, 12.5], tgt: [0, -0.6, 0], fov: 40, cxy: [0.5, 0.42], title: "RING" },
  lenses: { eye: [-9, 4.5, 15], tgt: [0.5, -0.4, 0], fov: 36, cxy: [0.5, 0.40], title: "LENSES" },
  spine:  { eye: [-11.5, 3.6, 16.4], tgt: [0, 0.0, 0], fov: 36, cxy: [0.5, 0.42], title: "SPINE" },
  radar:  { eye: [0, 9.5, 7.5], tgt: [0, 0, 0.3], fov: 44, cxy: [0.5, 0.42], title: "RADAR" },
  onion:  { eye: [-8.2, 4.6, 8.2], tgt: [0, -0.1, 0], fov: 40, cxy: [0.5, 0.43], title: "ONION" },
};
const pr = PRESETS[shape], num = (k, d) => (q.get(k) ? q.get(k).split(",").map(Number) : d);
const cam = camera(num("eye", pr.eye), num("tgt", pr.tgt), +(q.get("fov") || pr.fov), W, H, W * num("cxy", pr.cxy)[0], H * num("cxy", pr.cxy)[1]);
const RAMPS = { ascii: " .:-=+*#%@", bars: " ▁▂▃▄▅▆▇██", dots: " ··∙∙••●●◉", digits: " 123456789" };
if (q.get("ramp")) STYLE.ramp = RAMPS[q.get("ramp")];
if (q.get("lattice")) STYLE.lattice = q.get("lattice");
const sh = SHAPES[shape], opt = {};
// legacy=1 reproduces the Q2/Q3 renders exactly (the style constants of that day)
if (q.get("legacy") === "1") { STYLE.alpha = (b) => 0.03 + 0.97 * Math.pow(b, 2.4); STYLE.lattA = 0.14; STYLE.edgeA = 0.30; opt.allFrames = true; }
for (const k of ['pos', 'outline', 'label']) sh[k] = sh[k].bind(sh);
const pos = new Float32Array(3 * L * N);
for (let l = 0; l < L; l++) for (let n = 0; n < N; n++) {
  const p = sh.pos(l, n, opt), k = 3 * (l * N + n);
  if (!p) { pos[k] = NaN; continue; }
  pos[k] = p[0]; pos[k + 1] = p[1]; pos[k + 2] = p[2];
}
const d = Math.hypot(...pr.eye.map((e, i) => e - pr.tgt[i]));
const G = makeGrid(W, H, 9, 16);
splat(G, pos, v, cam, [d - 6, d + 8]);
for (let l = L - 1; l >= 0; l--) for (const line of sh.outline(l, opt)) polyline(G, line, cam);

// UI: same in every shape
const pad = (s, n) => String(s).padStart(n, "0"), U = STYLE;
put(G, 2, 1, "LOBOTOMY", U.uiHi, 1, true);
put(G, 12, 1, "QWEN3-0.6B · BACKEND: CPU STAND-IN · 28 × 3,072 NEURONS", U.ui, 0.55);
put(G, 2, 2, q.get('ramp') ? `GLYPHS: ${STYLE.ramp.slice(1).split('').join(' ')}` : `SHAPE: ${pr.title}`, U.ui, 0.5);
const lit = tokens[t].lit.toLocaleString();
putBig(G, G.COLS - 2 - lit.length * 2, 1, lit, U.uiHi, 0.95);
const sub = `ABOVE P99 · TOKEN ${pad(t, 3)}/256 · 29.0 TOK/S`; put(G, G.COLS - 2 - sub.length, 3, sub, U.ui, 0.5);
for (const l of (shape === 'radar' ? [0, 13, 27] : [0, 9, 18, 27])) {
  const p = cam(sh.label(l, opt));
  put(G, Math.floor(p.x / G.CW), Math.floor(p.y / G.CH), `L${pad(l, 2)}`, U.uiHi, 0.7);
}
const prompt = userPrompt(tokens), { answer } = answerText(tokens, t), cur = tokens[t].text;
const R0 = G.ROWS - 7;
put(G, 2, R0, "> " + prompt, U.ui, 0.45);
const words = answer.split(/(?<=\s)/); let col = 2, row = R0 + 1;
words.forEach((w, wi) => {
  if (col + w.length > 110) { col = 2; row++; }
  const last = wi === words.length - 1;
  put(G, col, row, w, last ? U.posHi : U.uiHi, last ? 1 : 0.82, last);
  if (last) { for (let j = 0; j < w.length; j++) if (w[j] !== " ") G.over[row * G.COLS + col + j].glow = U.pos; put(G, col + w.length, row, "█", U.pos, 0.9); }
  col += w.length;
});
const bars = " ▁▂▃▄▅▆▇█", maxLit = Math.max(...tokens.slice(1).map((x) => x.lit));
put(G, 2, G.ROWS - 2, "TAPE", U.ui, 0.4);
tokens.forEach((tok, j) => { if (!j) return; const kk = Math.max(1, Math.round((8 * tok.lit) / maxLit)); put(G, 7 + j, G.ROWS - 2, bars[kk], j === t ? U.posHi : U.ui, j === t ? 1 : j > t ? 0.12 : tok.kind === "prompt" ? 0.3 : 0.6); });
draw(g, G, dpr);
window.__ready = true;
</script></body></html>
